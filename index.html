<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>教師通知單與 LINE 訊息小幫手</title>

<style>

/* =========================
   基本設定
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef5ff,
            #f8fbff
        );

    color: #263238;
}


/* =========================
   Header
========================= */

.header {

    background:
        linear-gradient(
            135deg,
            #1565c0,
            #42a5f5
        );

    color: white;

    padding: 35px 20px;

    text-align: center;
}

.header h1 {

    margin: 0;

    font-size:
        clamp(28px, 4vw, 46px);

    font-weight: 900;
}

.header p {

    margin: 10px 0 0;

    font-size:
        clamp(16px, 2vw, 21px);

    opacity: .95;
}


/* =========================
   主容器
========================= */

.container {

    width: min(
        1200px,
        94%
    );

    margin: 30px auto;
}


/* =========================
   選擇功能
========================= */

.mode-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

    margin-bottom: 25px;
}

.mode-button {

    border: none;

    border-radius: 18px;

    padding: 20px;

    background: white;

    color: #546e7a;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.08);

    transition: .2s;
}

.mode-button:hover {

    transform:
        translateY(-2px);
}

.mode-button.active {

    background: #1976d2;

    color: white;

    box-shadow:
        0 7px 20px
        rgba(25,118,210,.3);
}


/* =========================
   卡片
========================= */

.card {

    background: white;

    border-radius: 22px;

    padding: 30px;

    margin-bottom: 25px;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.08);
}

.card h2 {

    margin-top: 0;

    color: #1565c0;

    font-size: 28px;
}


/* =========================
   表單
========================= */

label {

    display: block;

    margin-top: 20px;

    margin-bottom: 8px;

    font-weight: bold;

    font-size: 18px;
}

.required {

    color: #e53935;
}

input,
select,
textarea {

    width: 100%;

    border:
        2px solid #d7e0e7;

    border-radius: 12px;

    padding: 14px 16px;

    font-family: inherit;

    font-size: 18px;

    outline: none;

    background: #fff;
}

input:focus,
select:focus,
textarea:focus {

    border-color: #42a5f5;

    box-shadow:
        0 0 0 3px
        rgba(66,165,245,.12);
}

textarea {

    min-height: 150px;

    resize: vertical;

    line-height: 1.7;
}

.hint {

    margin-top: 6px;

    color: #78909c;

    font-size: 14px;
}


/* =========================
   產生按鈕
========================= */

.generate-button {

    width: 100%;

    margin-top: 25px;

    border: none;

    border-radius: 14px;

    padding: 17px;

    background:
        linear-gradient(
            135deg,
            #1976d2,
            #42a5f5
        );

    color: white;

    font-family: inherit;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;
}

.generate-button:hover {

    filter: brightness(1.05);

    transform:
        translateY(-1px);
}


/* =========================
   結果
========================= */

.result {

    display: none;
}

.result.show {

    display: block;
}

.result-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.result-title h2 {

    margin: 0;
}

.copy-button {

    border: none;

    border-radius: 10px;

    padding: 10px 16px;

    background: #43a047;

    color: white;

    font-family: inherit;

    font-weight: bold;

    cursor: pointer;
}

.result-box {

    background: #f8fafc;

    border:
        2px solid #e1e8ed;

    border-radius: 15px;

    padding: 25px;

    white-space: pre-wrap;

    line-height: 1.9;

    font-size: 18px;

    min-height: 200px;
}


/* =========================
   清除
========================= */

.clear-button {

    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 13px;

    background: #eceff1;

    color: #455a64;

    font-family: inherit;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   Footer
========================= */

.footer {

    text-align: center;

    color: #90a4ae;

    padding: 25px;
}


/* =========================
   手機
========================= */

@media (max-width: 700px) {

    .mode-buttons {

        grid-template-columns: 1fr;
    }

    .card {

        padding: 20px;
    }

    .result-title {

        align-items: stretch;

        flex-direction: column;
    }

    .copy-button {

        width: 100%;
    }

}

</style>

</head>


<body>


<!-- =========================
     Header
========================= -->

<header class="header">

    <h1>
        ✨ 教師通知單與 LINE 小幫手
    </h1>

    <p>
        輸入活動內容，快速整理成正式通知單或家長 LINE 訊息
    </p>

</header>


<main class="container">


    <!-- =========================
         功能選擇
    ========================== -->

    <div class="mode-buttons">

        <button
            class="mode-button active"
            id="noticeModeButton"
            onclick="switchMode('notice')">

            📄 活動通知單

        </button>


        <button
            class="mode-button"
            id="lineModeButton"
            onclick="switchMode('line')">

            💬 LINE 訊息生成

        </button>

    </div>



    <!-- =========================
         活動通知單
    ========================== -->

    <section
        class="card"
        id="noticeForm">

        <h2>
            📄 活動通知單生成
        </h2>


        <label>

            活動類型
            <span class="required">*</span>

        </label>

        <input
            id="activityType"
            type="text"
            placeholder="例如：科學展覽、運動比賽、校外參訪...">


        <label>

            活動詳情
            <span class="required">*</span>

        </label>

        <textarea
            id="activityDetails"
            placeholder="請描述活動目的、對象、日期時間、地點、選拔條件等相關資訊...">
        </textarea>


        <label>

            額外資訊（選填）

        </label>

        <textarea
            id="extraInfo"
            placeholder="例如：請攜帶水壺、午餐、雨具，或其他注意事項...">
        </textarea>


        <button
            class="generate-button"
            onclick="generateNotice()">

            ✨ 生成活動通知單

        </button>

    </section>



    <!-- =========================
         LINE 訊息
    ========================== -->

    <section
        class="card"
        id="lineForm"
        style="display:none;">

        <h2>
            💬 LINE 訊息生成
        </h2>


        <label>

            訊息類型

        </label>

        <select id="messageType">

            <option value="活動公告">
                活動公告
            </option>

            <option value="作業提醒">
                作業提醒
            </option>

            <option value="重要通知">
                重要通知
            </option>

            <option value="學校通知">
                學校通知
            </option>

            <option value="溫馨提醒">
                溫馨提醒
            </option>

        </select>


        <label>

            接收對象

        </label>

        <select id="receiver">

            <option value="家長">
                家長
            </option>

            <option value="學生">
                學生
            </option>

            <option value="家長與學生">
                家長與學生
            </option>

        </select>


        <label>

            訊息內容
            <span class="required">*</span>

        </label>

        <textarea
            id="lineContent"
            placeholder="請描述您想要傳達的訊息內容核心重點...">
        </textarea>


        <button
            class="generate-button"
            onclick="generateLine()">

            💬 生成 LINE 訊息

        </button>

    </section>



    <!-- =========================
         產生結果
    ========================== -->

    <section
        class="card result"
        id="result">


        <div class="result-title">

            <h2 id="resultTitle">
                📄 生成結果
            </h2>


            <button
                class="copy-button"
                onclick="copyResult()">

                📋 複製內容

            </button>

        </div>


        <div
            class="result-box"
            id="resultBox">

        </div>


        <button
            class="clear-button"
            onclick="clearResult()">

            🔄 清除結果

        </button>

    </section>

</main>


<footer class="footer">

    教師通知單與 LINE 小幫手

</footer>



<script>

/* =====================================================
   目前模式
===================================================== */

let currentMode = "notice";


/* =====================================================
   切換模式
===================================================== */

function switchMode(mode) {

    currentMode = mode;


    const noticeForm =
        document.getElementById(
            "noticeForm"
        );

    const lineForm =
        document.getElementById(
            "lineForm"
        );

    const noticeButton =
        document.getElementById(
            "noticeModeButton"
        );

    const lineButton =
        document.getElementById(
            "lineModeButton"
        );


    if (mode === "notice") {

        noticeForm.style.display =
            "block";

        lineForm.style.display =
            "none";

        noticeButton.classList.add(
            "active"
        );

        lineButton.classList.remove(
            "active"
        );

    }

    else {

        noticeForm.style.display =
            "none";

        lineForm.style.display =
            "block";

        noticeButton.classList.remove(
            "active"
        );

        lineButton.classList.add(
            "active"
        );

    }


    clearResult();

}


/* =====================================================
   取得目前日期
===================================================== */

function getToday() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth() + 1;


    const day =
        now.getDate();


    const weekdays = [
        "日",
        "一",
        "二",
        "三",
        "四",
        "五",
        "六"
    ];


    return `${year}年${month}月${day}日（星期${weekdays[now.getDay()]}）`;

}


/* =====================================================
   產生活動通知單
===================================================== */

function generateNotice() {

    const activityType =
        document
        .getElementById(
            "activityType"
        )
        .value
        .trim();


    const details =
        document
        .getElementById(
            "activityDetails"
        )
        .value
        .trim();


    const extra =
        document
        .getElementById(
            "extraInfo"
        )
        .value
        .trim();


    if (!activityType) {

        alert(
            "請輸入活動類型。"
        );

        return;

    }


    if (!details) {

        alert(
            "請輸入活動詳情。"
        );

        return;

    }


    let result = "";


    result +=
        `📢 ${activityType}通知單\n\n`;


    result +=
        `親愛的家長您好：\n\n`;


    result +=
        `本校將辦理「${activityType}」，相關資訊如下：\n\n`;


    result +=
        `📌 活動說明\n${details}\n\n`;


    if (extra) {

        result +=
            `📌 注意事項\n${extra}\n\n`;

    }


    result +=
        `敬請家長協助留意相關事項，謝謝您的配合！\n\n`;


    result +=
        `日期：${getToday()}`;


    showResult(
        "📄 活動通知單",
        result
    );

}


/* =====================================================
   產生 LINE 訊息
===================================================== */

function generateLine() {

    const messageType =
        document
        .getElementById(
            "messageType"
        )
        .value;


    const receiver =
        document
        .getElementById(
            "receiver"
        )
        .value;


    const content =
        document
        .getElementById(
            "lineContent"
        )
        .value
        .trim();


    if (!content) {

        alert(
            "請輸入訊息內容。"
        );

        return;

    }


    let greeting = "";


    if (receiver === "家長") {

        greeting =
            "各位家長您好！";

    }

    else if (
        receiver === "學生"
    ) {

        greeting =
            "同學們大家好！";

    }

    else {

        greeting =
            "各位家長、同學大家好！";

    }


    let result = "";


    result +=
        `📢 ${messageType}\n\n`;


    result +=
        `${greeting}\n\n`;


    result +=
        `${content}\n\n`;


    result +=
        `以上訊息敬請留意，謝謝您的配合！`;


    showResult(
        "💬 LINE 訊息",
        result
    );

}


/* =====================================================
   顯示結果
===================================================== */

function showResult(
    title,
    content
) {

    document.getElementById(
        "resultTitle"
    ).textContent =
        title;


    document.getElementById(
        "resultBox"
    ).textContent =
        content;


    document.getElementById(
        "result"
    ).classList.add(
        "show"
    );


    document
        .getElementById(
            "result"
        )
        .scrollIntoView({

            behavior: "smooth"

        });

}


/* =====================================================
   複製
===================================================== */

async function copyResult() {

    const text =
        document.getElementById(
            "resultBox"
        ).textContent;


    try {

        await navigator.clipboard.writeText(
            text
        );


        alert(
            "✅ 已複製，可以直接貼到 LINE！"
        );

    }

    catch {

        alert(
            "複製失敗，請手動選取文字複製。"
        );

    }

}


/* =====================================================
   清除結果
===================================================== */

function clearResult() {

    document.getElementById(
        "result"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "resultBox"
    ).textContent = "";

}

</script>

</body>

</html>
